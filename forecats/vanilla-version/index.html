<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Weather Animation Container -->
    <div id="weather-animation" class="weather-animation-container"></div>
    
    <main class="container px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center gap-3 mb-3">
                <i data-lucide="cloud-sun" class="h-10 w-10 text-primary"></i>
                <h1 class="text-4xl font-bold tracking-tight font-display text-slate-900">Weatherly</h1>
            </div>
            <p class="text-slate-500 font-medium font-sans">Beautiful weather forecasts, powered by Open-Meteo</p>
        </header>

        <!-- Search -->
        <div class="flex justify-center mb-12 relative z-50">
            <div class="relative w-full max-w-md">
                <div class="search-container flex items-center">
                    <i data-lucide="search" class="ml-4 h-4 w-4 text-muted-foreground"></i>
                    <input 
                        type="text" 
                        id="search-input"
                        class="clean-input placeholder:text-muted-foreground"
                        placeholder="Search for a city..."
                        autocomplete="off"
                    >
                </div>
                
                <!-- Dropdown -->
                <div id="search-results" class="absolute top-full mt-2 w-full bg-white rounded-xl shadow-xl overflow-hidden hidden"></div>
            </div>
            
            <button id="geo-btn" class="ml-4 p-4 bg-white hover:bg-slate-50 shadow-sm rounded-xl transition-all hover:scale-105 active:scale-95" title="Use My Location">
                <i data-lucide="map-pin" class="h-5 w-5 text-primary"></i>
            </button>
        </div>

        <!-- Skeleton -->
        <div id="loading-skeleton" class="hidden animate-pulse max-w-4xl mx-auto space-y-6">
            <div class="h-96 bg-white/50 rounded-3xl"></div>
        </div>

        <!-- Content -->
        <div id="weather-content" class="hidden max-w-5xl mx-auto space-y-8 fade-in">
            
            <!-- Main Weather Card -->
            <div class="weather-card">
                <!-- Top Section: Location & Icon -->
                <div class="flex flex-col md:flex-row justify-between relative z-10 mb-10">
                    <div class="text-center md:text-left">
                        <div class="flex items-center gap-2 text-slate-500 mb-2">
                            <i data-lucide="map-pin" class="h-4 w-4"></i>
                            <span id="location-name" class="text-sm font-medium">Loading...</span>
                        </div>
                        
                        <!-- Weather Meme -->
                        <div id="weather-meme" class="meme-container mb-4 p-3 bg-gradient-to-r from-purple-50 to-pink-50 rounded-xl border border-purple-100">
                            <div class="flex items-center gap-2">
                                <span class="text-xl">💭</span>
                                <p class="text-sm font-medium text-slate-700 italic"></p>
                            </div>
                        </div>
                        <h2 id="city-name" class="text-4xl md:text-5xl font-bold text-slate-900 mb-1 font-display">Loading...</h2>
                        <p id="current-date" class="text-slate-500 font-medium font-sans">Thursday, Feb 5</p>

                        <div class="mt-8 flex items-center justify-center md:justify-start gap-6">
                            <span id="current-temp" class="text-8xl md:text-9xl font-bold text-slate-900 tracking-tighter font-display">-</span>
                            <div class="flex flex-col items-start gap-1">
                                <span id="weather-desc" class="text-2xl font-medium text-slate-700 font-display">Clear</span>
                                <span id="feels-like" class="text-slate-500 font-sans">Feels like -</span>
                            </div>
                        </div>
                    </div>

                    <!-- Right Side: Big Visual (Icon) -->
                    <div class="flex items-center justify-center mt-8 md:mt-0 md:pr-12">
                        <!-- We insert a large Lucide icon here with custom styling -->
                        <div id="main-icon-container" class="relative">
                            <!-- Injected via JS -->
                        </div>
                    </div>
                </div>

                <!-- Bottom Divider -->
                <div class="h-px bg-slate-100 my-8"></div>

                <!-- Bottom Section: Details Grid -->
                <div class="grid grid-cols-2 md:grid-cols-6 gap-8">
                    <div class="detail-item">
                        <i data-lucide="droplets" class="h-5 w-5 icon-blue"></i>
                        <span class="text-xs text-muted-foreground font-bold uppercase tracking-wider">Humidity</span>
                        <span id="detail-humidity" class="font-bold text-lg text-slate-700">-</span>
                    </div>
                    <div class="detail-item">
                        <i data-lucide="wind" class="h-5 w-5 icon-slate"></i>
                        <span class="text-xs text-muted-foreground font-bold uppercase tracking-wider">Wind</span>
                        <span id="detail-wind" class="font-bold text-lg text-slate-700">-</span>
                    </div>
                    <div class="detail-item">
                        <i data-lucide="eye" class="h-5 w-5 icon-slate"></i>
                        <span class="text-xs text-muted-foreground font-bold uppercase tracking-wider">Visibility</span>
                        <span id="detail-visibility" class="font-bold text-lg text-slate-700">-</span>
                    </div>
                     <div class="detail-item">
                        <i data-lucide="gauge" class="h-5 w-5 icon-slate"></i>
                        <span class="text-xs text-muted-foreground font-bold uppercase tracking-wider">Pressure</span>
                        <span id="detail-pressure" class="font-bold text-lg text-slate-700">-</span>
                    </div>
                    <div class="detail-item">
                        <i data-lucide="sunrise" class="h-5 w-5 icon-orange"></i>
                        <span class="text-xs text-muted-foreground font-bold uppercase tracking-wider">Sunrise</span>
                        <span id="detail-sunrise" class="font-bold text-lg text-slate-700">-</span>
                    </div>
                    <div class="detail-item">
                        <i data-lucide="sunset" class="h-5 w-5 icon-orange"></i>
                        <span class="text-xs text-muted-foreground font-bold uppercase tracking-wider">Sunset</span>
                        <span id="detail-sunset" class="font-bold text-lg text-slate-700">-</span>
                    </div>
                </div>
            </div>

            <!-- Hourly Forecast -->
             <div class="glass-card p-6">
                <h3 class="text-lg font-bold mb-4 text-slate-800 font-sans">Hourly Forecast</h3>
                <div class="h-[150px] w-full">
                     <canvas id="hourly-chart"></canvas>
                </div>
            </div>

            <!-- Daily Forecast + Music/Map Grid -->
            <div class="grid md:grid-cols-2 gap-8">
                <!-- Daily Forecast (Left - Full Height) -->
                <div class="glass-card p-6">
                    <h3 class="text-lg font-bold mb-6 text-slate-800 font-sans">7-Day Forecast</h3>
                    <div id="daily-forecast-list" class="space-y-4"></div>
                </div>
                
                <!-- Right Column: Music + Map -->
                <div class="flex flex-col gap-8">
                    <!-- Weather Music Playlist -->
                    <div class="glass-card p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <i data-lucide="music" class="h-5 w-5 text-primary"></i>
                                <h3 class="text-lg font-bold text-slate-800 font-sans">Vibe Check</h3>
                                
                                <!-- Volume Slider -->
                                <label class="slider">
                                    <input type="range" class="level" min="0" max="100" value="70" />
                                    <svg
                                        class="volume"
                                        xmlns="http://www.w3.org/2000/svg"
                                        version="1.1"
                                        width="24"
                                        height="24"
                                        viewBox="0 0 24 24"
                                    >
                                        <g>
                                            <path
                                                d="M18.36 19.36a1 1 0 0 1-.705-1.71C19.167 16.148 20 14.142 20 12s-.833-4.148-2.345-5.65a1 1 0 1 1 1.41-1.419C20.958 6.812 22 9.322 22 12s-1.042 5.188-2.935 7.069a.997.997 0 0 1-.705.291z"
                                                fill="currentColor"
                                            ></path>
                                            <path
                                                d="M15.53 16.53a.999.999 0 0 1-.703-1.711C15.572 14.082 16 13.054 16 12s-.428-2.082-1.173-2.819a1 1 0 1 1 1.406-1.422A6 6 0 0 1 18 12a6 6 0 0 1-1.767 4.241.996.996 0 0 1-.703.289zM12 22a1 1 0 0 1-.707-.293L6.586 17H4c-1.103 0-2-.897-2-2V9c0-1.103.897-2 2-2h2.586l4.707-4.707A.998.998 0 0 1 13 3v18a1 1 0 0 1-1 1z"
                                                fill="currentColor"
                                            ></path>
                                        </g>
                                    </svg>
                                </label>
                            </div>
                            <span id="playlist-mood" class="text-xs px-3 py-1 bg-purple-100 text-purple-700 rounded-full font-medium">✨</span>
                        </div>
                        <div id="spotify-player" class="rounded-xl overflow-hidden">
                            <!-- Spotify embed will be inserted here -->
                        </div>
                    </div>

                    <!-- Map -->
                    <div class="glass-card p-0 overflow-hidden flex flex-col relative min-h-[400px]">
                        <div id="map-container" class="w-full h-full absolute inset-0 z-0"></div>
                    </div>
                </div>
            </div>


            <!-- Other Cities (Full Width) -->
            <div class="pt-4">
                <h3 class="text-xl font-bold mb-6 text-slate-800 font-sans">Other Cities</h3>
                <div id="nearby-cities-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </div>

        </div>

        <footer class="mt-12 text-center pb-8">
            <div class="inline-block bg-white px-4 py-2 rounded-full shadow-sm">
                <p class="text-xs text-slate-500">
                    Free weather data by <span class="font-bold text-slate-700">Open-Meteo</span>
                </p>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
